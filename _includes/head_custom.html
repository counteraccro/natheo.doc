<style>
  /* Mise en page façon back-office : sidebar collée à gauche, contenu fluide.
     On ne touche à rien avant le point où just-the-docs se met lui-même à
     centrer sidebar+contenu (son breakpoint "lg" = content-width + nav-width,
     soit 66.5rem par défaut) : avant ça, son mode "md" (sidebar fixe déjà
     collée à gauche) est correct tel quel, pas besoin d'intervenir plus tôt. */
  @media (min-width: 66.5rem) {
    .side-bar {
      width: 18rem !important; /* un peu plus large que le CMS (256px) pour les libellés longs */
      left: 0 !important;
    }

    .main {
      margin-left: 18rem !important;
    }
  }

  .main-content {
    max-width: none !important;
  }

  .side-bar,
  .site-header,
  .site-nav,
  .site-footer {
    border: 0 !important; /* pas de ligne de séparation entre le titre et le menu */
  }

  /* Titre "Nathéo CMS V2" en haut de la sidebar (le thème le colore avec
     $body-heading-color, sombre chez nous → invisible sur fond sombre) */
  .side-bar .site-title {
    color: #fff !important;
    font-size: 1.25rem;
    font-weight: 700;
  }

  /* Items de nav façon "pilule" (back-office Nathéo CMS). Le survol est posé
     sur la LIGNE entière (li), pas sur le lien seul : le bouton d'ouverture
     du sous-menu partage ainsi le même survol que le lien, au lieu d'avoir
     son propre fond qui se chevauchait avec celui du lien. */
  .side-bar .nav-list-item {
    border-radius: 8px;
    margin: 2px 1rem;
  }

  .side-bar .nav-list-item .nav-list-item {
    margin: 2px 1rem; /* même largeur de pilule que le niveau 1 */
  }

  .side-bar .nav-list-link,
  .side-bar .nav-list-expander {
    background-image: none !important;
    border-radius: 8px;
  }

  .side-bar .nav-list-link {
    min-height: 0 !important;
    margin: 0 !important;
    padding: 0.7rem 0.75rem !important;
    color: #e5e7eb !important; /* couleur par défaut identique à tous les niveaux */
    font-size: 1rem !important;
  }

  .side-bar .nav-list-item .nav-list .nav-list-link {
    padding: 0.55rem 0.75rem 0.55rem 1.75rem !important; /* indentation par le texte, pas par la pilule */
    font-size: 0.9rem !important;
  }

  /* Survol = gris, page courante = violet plein (comme le CMS) */
  .side-bar .nav-list-item:hover > .nav-list-link,
  .side-bar .nav-list-item:hover > .nav-list-expander {
    background-color: #374151 !important;
    color: #fff !important;
  }

  .side-bar .nav-list-link.active {
    background-color: #8b5cf6 !important;
    color: #fff !important;
  }

  .side-bar .nav-list-expander {
    color: #e5e7eb !important;
  }

  .side-bar .nav-list-item > .nav-list {
    padding-left: 0;
    padding-right: 0;
  }

  /* laisse de la place pour le chevron sur les items dépliables */
  .side-bar .nav-list-item:has(> .nav-list-expander) > .nav-list-link {
    padding-right: 2.5rem !important;
  }

  /* Champ de recherche façon back-office : bordure + fond blanc visibles,
     au lieu de la simple ombre portée par défaut de just-the-docs */
  .search-input-wrap {
    border-radius: 8px !important;
    box-shadow: none !important;
    border: 1px solid #d1d5db;
    left: 0 !important;
    right: 0 !important;
    margin: 0 auto !important; /* centre le champ dans l'espace disponible de l'entête */
  }

  .search-input {
    border: none !important;
    background-color: #fff !important;
    border-radius: 8px !important;
    color: #111827 !important;
  }

  .search-input:focus {
    outline: none !important;
    box-shadow: 0 0 0 2px #8b5cf6 !important;
  }

  .search-icon {
    color: #9ca3af !important;
  }

  /* Lien GitHub de l'entête : le style "site-button" par défaut de
     just-the-docs est pensé pour la sidebar sombre (bouton menu mobile),
     pas pour un lien sur fond blanc — d'où le hover sombre "horrible" ici.
     On le restreint au lien GitHub et on le refait en lien classique. */
  .aux-nav .site-button {
    display: inline-flex;
    align-items: center;
    align-self: center;
    gap: 0.4em;
    padding: 0.4em 0.75em;
    border-radius: 6px;
    color: #6b7280;
  }

  .aux-nav .site-button:hover {
    background-image: none !important;
    background-color: #f3f4f6 !important;
    color: #111827 !important;
  }

  .aux-nav .site-button .gh-icon {
    width: 1.1em;
    height: 1.1em;
    flex-shrink: 0;
  }

  /* Icônes de nav façon back-office Nathéo CMS (nav_icon en front-matter) */
  .nav-list-link {
    display: flex;
    align-items: center;
  }

  .nav-label {
    display: inline-block;
    line-height: 1.2;
  }

  .nav-icon {
    display: block; /* évite les décalages liés au rendu "inline" par défaut d'un svg */
    width: 1.05em;
    height: 1.05em;
    margin-right: 0.55em;
    flex-shrink: 0;
    opacity: 0.85;
  }

  /* Captures d'écran : taille uniforme + clic pour agrandir */
  .main-content img {
    display: block;
    width: 100%;
    height: 300px;
    object-fit: contain;
    object-position: center;
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    padding: 10px;
    box-sizing: border-box;
    cursor: zoom-in;
    margin: 1.25rem 0;
  }

  #img-lightbox-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
    padding: 3rem;
  }

  #img-lightbox-overlay.is-open {
    display: flex;
  }

  #img-lightbox-overlay img {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var overlay = document.createElement('div');
    overlay.id = 'img-lightbox-overlay';
    var overlayImg = document.createElement('img');
    overlay.appendChild(overlayImg);
    document.body.appendChild(overlay);

    function closeLightbox() {
      overlay.classList.remove('is-open');
      overlayImg.src = '';
    }

    overlay.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeLightbox();
    });

    document.querySelectorAll('.main-content img').forEach(function (img) {
      img.addEventListener('click', function () {
        overlayImg.src = img.currentSrc || img.src;
        overlay.classList.add('is-open');
      });
    });

    // Icône GitHub devant le lien "Nathéo CMS sur GitHub" de l'entête
    var ghLink = document.querySelector('.aux-nav .site-button');
    if (ghLink && !ghLink.querySelector('.gh-icon')) {
      ghLink.insertAdjacentHTML(
        'afterbegin',
        '<svg class="gh-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
          '<path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 ' +
          '0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15' +
          '-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51' +
          '-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 ' +
          '0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-' +
          '.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25' +
          '.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0' +
          '-4.42-3.58-8-8-8Z"></path>' +
        '</svg>'
      );
    }
  });
</script>
