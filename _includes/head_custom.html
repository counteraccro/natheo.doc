<style>
  /* Mise en page façon back-office : sidebar collée à gauche, contenu fluide
     (just-the-docs centre par défaut sidebar+contenu au-delà de ~1064px) */
  @media (min-width: 50rem) {
    .side-bar {
      width: 256px !important;
      left: 0 !important;
    }

    .main {
      margin-left: 256px !important;
    }
  }

  .main-content {
    max-width: none !important;
  }

  /* Items de nav façon "pilule" (back-office Nathéo CMS) */
  .nav-list-item .nav-list-link {
    border-radius: 8px;
    margin: 2px 0.5rem;
  }

  .nav-list-item .nav-list-link:hover,
  .nav-list-item .nav-list-link.active {
    background-image: none;
    background-color: #374151; /* --sidebar-hover du CMS */
    color: #fff;
  }

  .nav-list-item .nav-list-expander:hover {
    background-image: none;
    background-color: #374151;
    border-radius: 8px;
  }

  .nav-list-item .nav-list .nav-list-link {
    font-size: 0.875rem;
  }

  .nav-list-item > .nav-list {
    padding-left: 1.75rem; /* indentation des sous-menus, façon ml-8 du CMS */
  }

  /* Icônes de nav façon back-office Nathéo CMS (nav_icon en front-matter) */
  .nav-list-link {
    display: flex;
    align-items: center;
  }

  .nav-icon {
    width: 1.05em;
    height: 1.05em;
    margin-right: 0.55em;
    flex-shrink: 0;
    opacity: 0.85;
  }

  /* Captures d'écran : taille uniforme + clic pour agrandir */
  .main-content img {
    display: block;
    width: 100%;
    height: 300px;
    object-fit: contain;
    object-position: center;
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    padding: 10px;
    box-sizing: border-box;
    cursor: zoom-in;
    margin: 1.25rem 0;
  }

  #img-lightbox-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
    padding: 3rem;
  }

  #img-lightbox-overlay.is-open {
    display: flex;
  }

  #img-lightbox-overlay img {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var overlay = document.createElement('div');
    overlay.id = 'img-lightbox-overlay';
    var overlayImg = document.createElement('img');
    overlay.appendChild(overlayImg);
    document.body.appendChild(overlay);

    function closeLightbox() {
      overlay.classList.remove('is-open');
      overlayImg.src = '';
    }

    overlay.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeLightbox();
    });

    document.querySelectorAll('.main-content img').forEach(function (img) {
      img.addEventListener('click', function () {
        overlayImg.src = img.currentSrc || img.src;
        overlay.classList.add('is-open');
      });
    });
  });
</script>
