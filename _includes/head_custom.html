<style>
  /* Mise en page façon back-office : sidebar collée à gauche, contenu fluide
     (just-the-docs centre par défaut sidebar+contenu au-delà de ~1064px) */
  @media (min-width: 50rem) {
    .side-bar {
      width: 256px !important;
      left: 0 !important;
    }

    .main {
      margin-left: 256px !important;
    }
  }

  .main-content {
    max-width: none !important;
  }

  /* Titre "Nathéo CMS V2" en haut de la sidebar (le thème le colore avec
     $body-heading-color, sombre chez nous → invisible sur fond sombre) */
  .side-bar .site-title {
    color: #fff !important;
    font-size: 1.25rem;
    font-weight: 700;
  }

  /* Items de nav façon "pilule" (back-office Nathéo CMS) : la pilule est
     alignée sur la même marge que le titre (16px), pas collée au bord */
  .side-bar .nav-list-link {
    min-height: 0;
    margin: 2px 1rem;
    padding: 0.65rem 0.75rem;
    color: #e5e7eb !important; /* couleur par défaut identique à tous les niveaux */
    font-size: 1rem;
    border-radius: 8px;
  }

  .side-bar .nav-list-item .nav-list .nav-list-link {
    margin: 2px 1rem;
    padding: 0.5rem 0.75rem;
    font-size: 0.9rem;
  }

  /* Survol = gris (comme le CMS) */
  .side-bar .nav-list-link:hover {
    background-image: none !important;
    background-color: #374151 !important;
    color: #fff !important;
  }

  /* Page courante = violet plein (comme le CMS) — après :hover dans l'ordre
     des règles pour rester prioritaire même si l'item actif est survolé */
  .side-bar .nav-list-link.active {
    background-image: none !important;
    background-color: #8b5cf6 !important;
    color: #fff !important;
  }

  .side-bar .nav-list-expander {
    color: #e5e7eb;
  }

  .side-bar .nav-list-expander:hover {
    background-image: none !important;
    background-color: #374151 !important;
    border-radius: 8px;
  }

  .side-bar .nav-list-item > .nav-list {
    padding-left: 1.25rem; /* indentation des sous-menus, façon ml-8 du CMS */
  }

  /* laisse de la place pour le chevron sur les items dépliables */
  .side-bar .nav-list-item:has(> .nav-list-expander) > .nav-list-link {
    padding-right: 2.5rem;
  }

  /* Icônes de nav façon back-office Nathéo CMS (nav_icon en front-matter) */
  .nav-list-link {
    display: flex;
    align-items: center;
  }

  .nav-icon {
    width: 1.05em;
    height: 1.05em;
    margin-right: 0.55em;
    flex-shrink: 0;
    opacity: 0.85;
  }

  /* Captures d'écran : taille uniforme + clic pour agrandir */
  .main-content img {
    display: block;
    width: 100%;
    height: 300px;
    object-fit: contain;
    object-position: center;
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    padding: 10px;
    box-sizing: border-box;
    cursor: zoom-in;
    margin: 1.25rem 0;
  }

  #img-lightbox-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
    padding: 3rem;
  }

  #img-lightbox-overlay.is-open {
    display: flex;
  }

  #img-lightbox-overlay img {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var overlay = document.createElement('div');
    overlay.id = 'img-lightbox-overlay';
    var overlayImg = document.createElement('img');
    overlay.appendChild(overlayImg);
    document.body.appendChild(overlay);

    function closeLightbox() {
      overlay.classList.remove('is-open');
      overlayImg.src = '';
    }

    overlay.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeLightbox();
    });

    document.querySelectorAll('.main-content img').forEach(function (img) {
      img.addEventListener('click', function () {
        overlayImg.src = img.currentSrc || img.src;
        overlay.classList.add('is-open');
      });
    });
  });
</script>
